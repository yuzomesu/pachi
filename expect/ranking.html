<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>全体集計ダッシュボード</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #f8f8f8;
      font-family: 'Segoe UI', sans-serif;
      padding: 1.5rem 1rem;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      color: #7dd3fc;
      margin-bottom: 1.5rem;
    }
    h2 {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 0.8rem;
    }

    /* サマリーカード */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      max-width: 640px;
      margin: 0 auto 1.5rem;
    }
    .stat-card {
      background: #2d2d2d;
      border-radius: 10px;
      padding: 0.9rem 0.8rem;
      text-align: center;
    }
    .stat-label {
      font-size: 0.72rem;
      color: #888;
      margin-bottom: 0.3rem;
    }
    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
    }
    .pos { color: #4ade80; }
    .neg { color: #f87171; }
    .neu { color: #f8f8f8; }
    .sky { color: #38bdf8; }

    /* チャートカード */
    .chart-card {
      background: #2d2d2d;
      border-radius: 12px;
      padding: 1.2rem;
      max-width: 800px;
      margin: 0 auto 1.5rem;
    }
    canvas { width: 100% !important; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #888;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back-link:hover { color: #7dd3fc; }

    #loading {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <h1>全体集計ダッシュボード</h1>

  <div id="loading">読み込み中...</div>

  <div id="content" style="display:none">

    <!-- サマリー数値 -->
    <div class="summary-grid">
      <div class="stat-card">
        <div class="stat-label">集計期間</div>
        <div class="stat-value neu" id="sumSessions">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">累計期待値</div>
        <div class="stat-value sky" id="sumEx">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">累計収支</div>
        <div class="stat-value" id="sumProfit">—</div>
      </div>
    </div>

    <!-- 月別棒グラフ -->
    <div class="chart-card">
      <h2>月別 合計期待値 / 合計収支</h2>
      <canvas id="monthlyChart" height="220"></canvas>
    </div>

    <!-- 累積折れ線グラフ -->
    <div class="chart-card">
      <h2>累積収支 vs 累積期待値</h2>
      <canvas id="cumulativeChart" height="220"></canvas>
    </div>

  </div>

  <a class="back-link" href="../index.html">← メインページへ</a>

  <script type="module">
  import { supabase } from '../assets/js/supabase-init.js';

  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { location.href = '../login.html'; return; }

    // ── データ取得（v_monthly_sum + profiles_done に統一） ──
    const [
      { data: monthly },
    ] = await Promise.all([
      supabase.from('v_monthly_sum').select('user_id, ym, profit, expect')
        .gte('ym', '2025-04-01')
        .order('ym'),
    ]);

    // ── 月別集計（全ユーザー合算） ─────────────────
    const monthMap = {};
    for (const r of (monthly ?? [])) {
      const key = String(r.ym).slice(0, 7);
      if (!monthMap[key]) monthMap[key] = { profit: 0, expect: 0 };
      monthMap[key].profit += Number(r.profit || 0);
      monthMap[key].expect += Number(r.expect || 0);
    }
    const monthKeys    = Object.keys(monthMap).sort();
    const monthProfits = monthKeys.map(k => monthMap[k].profit);
    const monthExpects = monthKeys.map(k => monthMap[k].expect);

    // ── サマリー計算 ──────────────────────────────
    const totalProfit = monthProfits.reduce((s, v) => s + v, 0);
    const totalEx     = monthExpects.reduce((s, v) => s + v, 0);
    const periodLabel = monthKeys.length
      ? `${monthKeys[0]} 〜 ${monthKeys[monthKeys.length - 1]}`
      : '—';

    document.getElementById('sumSessions').textContent = periodLabel;
    document.getElementById('sumEx').textContent       = totalEx.toLocaleString() + ' 円';
    const profitEl = document.getElementById('sumProfit');
    profitEl.textContent = totalProfit.toLocaleString() + ' 円';
    profitEl.className   = 'stat-value ' + (totalProfit >= 0 ? 'pos' : 'neg');

    // ── 月別棒グラフ ──────────────────────────────
    new Chart(document.getElementById('monthlyChart'), {
      type: 'bar',
      data: {
        labels: monthKeys,
        datasets: [
          {
            label: '合計期待値',
            data: monthExpects,
            backgroundColor: 'rgba(56,189,248,0.6)',
            borderColor: '#38bdf8',
            borderWidth: 1,
          },
          {
            label: '合計収支',
            data: monthProfits,
            backgroundColor: monthProfits.map(v => v >= 0 ? 'rgba(74,222,128,0.6)' : 'rgba(248,113,113,0.6)'),
            borderColor:     monthProfits.map(v => v >= 0 ? '#4ade80' : '#f87171'),
            borderWidth: 1,
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: '#ccc' } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()} 円` } }
        },
        scales: {
          x: { ticks: { color: '#aaa' }, grid: { color: '#333' } },
          y: { ticks: { color: '#aaa', callback: v => v.toLocaleString() }, grid: { color: '#333' } }
        }
      }
    });

    // ── 累積折れ線グラフ（月別データから構築） ────
    let cumP = 0, cumE = 0;
    const cumProfits = monthKeys.map(k => { cumP += monthMap[k].profit; return cumP; });
    const cumExes    = monthKeys.map(k => { cumE += monthMap[k].expect; return cumE; });

    new Chart(document.getElementById('cumulativeChart'), {
      type: 'line',
      data: {
        labels: monthKeys,
        datasets: [
          {
            label: '累積収支',
            data: cumProfits,
            borderColor: '#4ade80',
            backgroundColor: 'rgba(74,222,128,0.1)',
            borderWidth: 2,
            pointRadius: 2,
            fill: true,
            tension: 0.3,
          },
          {
            label: '累積期待値',
            data: cumExes,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56,189,248,0.1)',
            borderWidth: 2,
            pointRadius: 2,
            fill: true,
            tension: 0.3,
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: '#ccc' } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()} 円` } }
        },
        scales: {
          x: { ticks: { color: '#aaa' }, grid: { color: '#333' } },
          y: { ticks: { color: '#aaa', callback: v => v.toLocaleString() }, grid: { color: '#333' } }
        }
      }
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display  = 'block';
  })();
  </script>
</body>
</html>
