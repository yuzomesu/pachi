<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>防振り 設定判別</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; color: #111; font-family: system-ui, -apple-system, sans-serif; padding: 1.5rem 1rem; }
    h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.25rem; }
    .sub { font-size: 0.8rem; color: #888; margin-bottom: 1.5rem; }

    .section { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; max-width: 600px; }
    .section-title { font-size: 0.78rem; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 0.75rem; }

    /* Result bars */
    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .bar-label { width: 3rem; font-size: 0.8rem; text-align: right; color: #555; flex-shrink: 0; }
    .bar-track { flex: 1; background: #eee; border-radius: 3px; height: 14px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.25s; }
    .bar-pct { width: 3.5rem; font-size: 0.8rem; font-variant-numeric: tabular-nums; text-align: right; flex-shrink: 0; }
    .bar-row.top .bar-label { font-weight: 700; color: #111; }
    .bar-row.top .bar-pct { font-weight: 700; }

    /* Prior sliders */
    .prior-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem 1rem; }
    .prior-item label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; margin-bottom: 0.25rem; }
    .prior-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .prior-item input[type=range] { width: 100%; accent-color: #555; height: 4px; }
    .prior-pct { font-size: 0.75rem; color: #888; font-variant-numeric: tabular-nums; }
    .prior-actions { margin-top: 0.6rem; display: flex; gap: 0.5rem; }
    .btn-small { font-size: 0.75rem; padding: 0.25rem 0.7rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; color: #555; }
    .btn-small:hover { background: #f0f0f0; }

    /* Metric inputs */
    .metric { border-bottom: 1px solid #f0f0f0; padding-bottom: 0.9rem; margin-bottom: 0.9rem; }
    .metric:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
    .metric-name { font-size: 0.88rem; font-weight: 600; margin-bottom: 0.55rem; }
    .input-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .input-item { display: flex; flex-direction: column; gap: 0.18rem; min-width: 100px; flex: 1; }
    .input-item label { font-size: 0.72rem; color: #777; }
    .input-item input { padding: 0.35rem 0.5rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; font-variant-numeric: tabular-nums; background: #fafafa; width: 100%; }
    .input-item input:focus { outline: 1px solid #aaa; background: #fff; }

    /* Ref table */
    details { margin-top: 0.5rem; }
    summary { font-size: 0.72rem; color: #bbb; cursor: pointer; user-select: none; }
    summary:hover { color: #888; }
    .ref-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; margin-top: 0.3rem; }
    .ref-table th { color: #aaa; font-weight: 500; text-align: left; padding: 0.15rem 0.3rem; border-bottom: 1px solid #eee; }
    .ref-table td { padding: 0.15rem 0.3rem; color: #777; border-bottom: 1px solid #f5f5f5; }
    .ref-table tr:last-child td { border-bottom: none; }

    .reset-link { display: block; max-width: 600px; margin: 0.5rem 0 1.5rem; text-align: right; }
    .reset-link button { font-size: 0.78rem; color: #aaa; background: none; border: none; cursor: pointer; }
    .reset-link button:hover { color: #555; }

    .back { display: block; max-width: 600px; margin-top: 1rem; font-size: 0.82rem; color: #aaa; text-decoration: none; }
    .back:hover { color: #555; }
  </style>
</head>
<body>

<h1>防振り 設定判別</h1>
<p class="sub">ベイズ推定 — 観測データを入力すると設定確率をリアルタイム更新します</p>

<!-- 結果 -->
<div class="section">
  <div class="section-title">設定確率</div>
  <div id="bars"></div>
</div>

<!-- 事前確率 -->
<div class="section">
  <div class="section-title">事前確率（設定比率の想定）</div>
  <div class="prior-grid" id="priorGrid"></div>
  <div class="prior-actions">
    <button class="btn-small" id="priorEqual">均等にリセット</button>
    <button class="btn-small" id="priorLow">低設定寄り</button>
    <button class="btn-small" id="priorHigh">高設定寄り</button>
  </div>
</div>

<div class="reset-link"><button id="resetBtn">カウントをリセット</button></div>

<!-- 指標入力 -->
<div class="section" id="metrics"></div>

<a class="back" href="settings.html">← 設定判別へ</a>

<script>
const MACHINE = {
  name: "防振り",
  metrics: [
    { name:"上段5枚ベル出現率", type:"binomial", successLabel:"上段ベル回数", trialsLabel:"総ゲーム数",
      probs:[1/18.3,1/18.3,1/18.3,1/17.9,1/17.3,1/16.6] },
    { name:"ヒドラ目（非高確率）", type:"multinomial", categoryLabels:["非当選","運営高確率","EP"],
      probs:[[0.75,0.24575,0.00425],[0.75,0.24575,0.00425],[0.746,0.248666,0.005334],[0.7,0.2901,0.0099],[0.683,0.303686,0.013314],[0.667,0.317682,0.015318]] },
    { name:"ヒドラ目（高確率）", type:"multinomial", categoryLabels:["非当選","運営高確率","EP"],
      probs:[[0.5,0.4915,0.0085],[0.5,0.4915,0.0085],[0.504,0.485584,0.018416],[0.55,0.43515,0.01485],[0.554,0.427268,0.018732],[0.6,0.3816,0.0184]] },
    { name:"チェリー/スイカ → CZ当選率（高確率）", type:"binomial", successLabel:"CZ当選回数", trialsLabel:"チェリー/スイカ回数",
      probs:[0.038,0.063,0.063,0.083,0.088,0.092] },
    { name:"初当りボーナス後 即CZ（BET高確）", type:"binomial", successLabel:"即CZ当選回数", trialsLabel:"初当りボーナス回数",
      probs:[0.025,0.050,0.054,0.079,0.096,0.104] },
    { name:"150Gゾーン CZ当選率", type:"binomial", successLabel:"CZ当選回数", trialsLabel:"150Gゾーン到達回数",
      probs:[0.400,0.400,0.404,0.404,0.404,0.408] },
    { name:"300Gゾーン CZ当選率", type:"binomial", successLabel:"CZ当選回数", trialsLabel:"300Gゾーン到達回数",
      probs:[0.400,0.421,0.421,0.475,0.488,0.500] },
    { name:"450Gゾーン CZ当選率", type:"binomial", successLabel:"CZ当選回数", trialsLabel:"450Gゾーン到達回数",
      probs:[0.183,0.204,0.208,0.258,0.292,0.304] },
    { name:"650Gゾーン CZ当選率", type:"binomial", successLabel:"CZ当選回数", trialsLabel:"650Gゾーン到達回数",
      probs:[0.100,0.104,0.108,0.179,0.192,0.233] },
    { name:"無限CZ選択率（300GゾーンCZ当選時）", type:"binomial", successLabel:"無限CZ回数", trialsLabel:"300GゾーンCZ当選回数",
      probs:[0.317,0.392,0.396,0.442,0.458,0.471] },
    { name:"高確率(CZ)継続G振り分け（防御状態以外）", type:"multinomial", categoryLabels:["10G","20G","無限"],
      probs:[[0.950,0.046,0.004],[0.950,0.046,0.004],[0.946,0.050,0.004],[0.938,0.058,0.004],[0.929,0.067,0.004],[0.921,0.075,0.004]] },
    { name:"高確率(CZ)継続G振り分け（防御状態時）", type:"multinomial", categoryLabels:["10G","20G","無限"],
      probs:[[0.929,0.046,0.025],[0.929,0.046,0.025],[0.925,0.050,0.025],[0.917,0.058,0.025],[0.908,0.067,0.025],[0.900,0.075,0.025]] },
    { name:"サブ液晶タッチ時セリフ出現率", type:"multinomial",
      categoryLabels:["メイプルちゃんしか勝たん","サリーちゃんしか勝たん","楓の木しか勝たん","長い冒険になりそうだ","オリハルコンかな？"],
      probs:[[0.4997,0.4997,0.0006,0.0,0.0],[0.5690,0.4290,0.0020,0.0,0.0],[0.4280,0.5680,0.0040,0.0,0.0],[0.5690,0.4200,0.0100,0.0010,0.0],[0.4198,0.5690,0.0100,0.0012,0.0],[0.5704,0.4130,0.0150,0.0015,0.0001]] },
    { name:"ボーナス中キャラ紹介（0〜5000G）", type:"multinomial",
      categoryLabels:["青背景","銀翼","樹皇","ミィ","ペイン","機械神","大天使メイプル","ドラぞう","運営"],
      probs:[[0.8085,0.1300,0.0500,0.0100,0.0010,0.0005,0.0000,0.0000,0.0000],[0.7990,0.1340,0.0520,0.0120,0.0025,0.0000,0.0005,0.0000,0.0000],[0.7920,0.1380,0.0540,0.0120,0.0025,0.0005,0.0000,0.0010,0.0000],[0.7655,0.1420,0.0560,0.0120,0.0100,0.0005,0.0050,0.0010,0.0000],[0.7565,0.1460,0.0580,0.0200,0.0125,0.0050,0.0005,0.0010,0.0005],[0.7385,0.1500,0.0600,0.0250,0.0150,0.0050,0.0050,0.0010,0.0005]] },
    { name:"ボーナス中キャラ紹介（5001〜7000G）", type:"multinomial",
      categoryLabels:["青背景","銀翼","樹皇","ミィ","ペイン","機械神","大天使メイプル","ドラぞう","運営"],
      probs:[[0.8085,0.1300,0.0500,0.0100,0.0010,0.0005,0.0000,0.0000,0.0000],[0.7990,0.1340,0.0520,0.0120,0.0025,0.0000,0.0005,0.0000,0.0000],[0.7880,0.1380,0.0540,0.0120,0.0025,0.0005,0.0000,0.0050,0.0000],[0.7525,0.1420,0.0560,0.0200,0.0100,0.0020,0.0125,0.0050,0.0000],[0.7415,0.1460,0.0580,0.0200,0.0125,0.0125,0.0020,0.0050,0.0025],[0.7175,0.1500,0.0600,0.0250,0.0150,0.0125,0.0125,0.0050,0.0025]] },
    { name:"ボーナス中キャラ紹介（7001〜8000G）", type:"multinomial",
      categoryLabels:["青背景","銀翼","樹皇","ミィ","ペイン","機械神","大天使メイプル","ドラぞう","運営"],
      probs:[[0.8085,0.1300,0.0500,0.0100,0.0010,0.0005,0.0000,0.0000,0.0000],[0.7990,0.1340,0.0520,0.0120,0.0025,0.0000,0.0005,0.0000,0.0000],[0.7680,0.1380,0.0540,0.0120,0.0025,0.0005,0.0000,0.0250,0.0000],[0.6825,0.1420,0.0560,0.0200,0.0100,0.0020,0.0625,0.0250,0.0000],[0.6640,0.1460,0.0580,0.0200,0.0125,0.0625,0.0020,0.0250,0.0100],[0.5899,0.1500,0.0600,0.0250,0.0150,0.0625,0.0625,0.0250,0.0100]] }
  ]
};

// setting colors (subtle)
const SC = ['#9ca3af','#60a5fa','#34d399','#fb923c','#f472b6','#fbbf24'];
const SL = ['設定1','設定2','設定3','設定4','設定5','設定6'];

// ── State ─────────────────────────────────────────
let inputs = [];
let priorW = [1, 1, 1, 1, 1, 1]; // raw weights (0–100)

function normPrior() {
  const s = priorW.reduce((a,b)=>a+b,0) || 1;
  return priorW.map(w => w/s);
}

// ── Inference ─────────────────────────────────────
function infer() {
  const eps = 1e-12;
  const prior = normPrior();
  const logP = prior.map(p => Math.log(Math.max(eps, p)));

  for (let mi = 0; mi < MACHINE.metrics.length; mi++) {
    const m = MACHINE.metrics[mi];
    const r = inputs[mi] || [];
    const obs = m.type === 'binomial'
      ? [r[0]||0, Math.max(0,(r[1]||0)-(r[0]||0))]
      : r.map(v=>v||0);
    if (obs.reduce((a,b)=>a+b,0) === 0) continue;

    for (let s = 0; s < 6; s++) {
      const raw = m.type==='binomial' ? [m.probs[s], 1-m.probs[s]] : m.probs[s];
      const sumR = raw.reduce((a,b)=>a+b,0)||1;
      const p = raw.map(x => Math.min(1-eps, Math.max(eps, x/sumR)));
      const k = Math.min(obs.length, p.length);
      for (let i=0; i<k; i++) logP[s] += obs[i]*Math.log(p[i]);
    }
  }

  const mx = Math.max(...logP);
  const w = logP.map(v=>Math.exp(v-mx));
  const z = w.reduce((a,b)=>a+b,0)||1;
  return w.map(x=>x/z*100);
}

// ── Result bars ────────────────────────────────────
function updateBars() {
  const probs = infer();
  const top = probs.indexOf(Math.max(...probs));
  document.getElementById('bars').innerHTML = probs.map((p, i) => `
    <div class="bar-row${i===top?' top':''}">
      <div class="bar-label" style="${i===top?'color:'+SC[i]:''}">${SL[i]}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${p.toFixed(2)}%;background:${SC[i]}"></div>
      </div>
      <div class="bar-pct" style="${i===top?'color:'+SC[i]:''}">${p.toFixed(1)}%</div>
    </div>`).join('');
}

// ── Prior sliders ──────────────────────────────────
function renderPrior() {
  const norm = normPrior();
  document.getElementById('priorGrid').innerHTML = SL.map((lbl, i) => `
    <div class="prior-item">
      <label>
        <span class="prior-dot" style="background:${SC[i]}"></span>
        <span>${lbl}</span>
        <span class="prior-pct">${(norm[i]*100).toFixed(0)}%</span>
      </label>
      <input type="range" min="0" max="100" step="1" value="${priorW[i]}" data-pi="${i}">
    </div>`).join('');
  document.querySelectorAll('input[data-pi]').forEach(sl => {
    sl.addEventListener('input', () => {
      priorW[+sl.dataset.pi] = +sl.value;
      renderPrior();
      updateBars();
    });
  });
}

function setPrior(weights) {
  priorW = [...weights];
  renderPrior();
  updateBars();
}

document.getElementById('priorEqual').onclick = () => setPrior([1,1,1,1,1,1]);
document.getElementById('priorLow').onclick   = () => setPrior([40,25,15,10,6,4]);
document.getElementById('priorHigh').onclick  = () => setPrior([4,6,10,15,25,40]);

// ── Metric cards ───────────────────────────────────
function refTable(m) {
  if (m.type === 'binomial') {
    const rows = SL.map((l,i)=>{const q=m.probs[i];return`<tr><td>${l}</td><td>${(q*100).toFixed(3)}%</td><td>1/${(1/q).toFixed(1)}</td></tr>`;}).join('');
    return`<details><summary>参考確率</summary><table class="ref-table"><thead><tr><th>設定</th><th>確率</th><th>分母</th></tr></thead><tbody>${rows}</tbody></table></details>`;
  }
  const hdr=m.categoryLabels.map(c=>`<th>${c}</th>`).join('');
  const rows=SL.map((l,i)=>{const ps=m.probs[i],s=ps.reduce((a,b)=>a+b,0)||1;return`<tr><td>${l}</td>${ps.map(p=>`<td>${(p/s*100).toFixed(1)}%</td>`).join('')}</tr>`;}).join('');
  return`<details><summary>参考確率</summary><div style="overflow-x:auto"><table class="ref-table"><thead><tr><th>設定</th>${hdr}</tr></thead><tbody>${rows}</tbody></table></div></details>`;
}

function renderMetrics() {
  const el = document.getElementById('metrics');
  el.innerHTML = `<div class="section-title">指標入力</div>`;
  MACHINE.metrics.forEach((m, mi) => {
    const wrap = document.createElement('div');
    wrap.className = 'metric';
    let inp;
    if (m.type === 'binomial') {
      const sv=inputs[mi]?.[0]??'', tv=inputs[mi]?.[1]??'';
      inp=`<div class="input-row">
        <div class="input-item"><label>${m.trialsLabel}</label><input type="number" inputmode="numeric" min="0" value="${tv}" placeholder="0" data-mi="${mi}" data-ci="1"></div>
        <div class="input-item"><label>${m.successLabel}</label><input type="number" inputmode="numeric" min="0" value="${sv}" placeholder="0" data-mi="${mi}" data-ci="0"></div>
      </div>`;
    } else {
      inp=`<div class="input-row">${m.categoryLabels.map((c,ci)=>`
        <div class="input-item"><label>${c}</label><input type="number" inputmode="numeric" min="0" value="${inputs[mi]?.[ci]??''}" placeholder="0" data-mi="${mi}" data-ci="${ci}"></div>`).join('')}</div>`;
    }
    wrap.innerHTML=`<div class="metric-name">${m.name}</div>${inp}${refTable(m)}`;
    el.appendChild(wrap);
  });
  el.querySelectorAll('input[data-mi]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const mi=+inp.dataset.mi,ci=+inp.dataset.ci;
      if(!inputs[mi])inputs[mi]=[];
      inputs[mi][ci]=Math.max(0,parseInt(inp.value)||0);
      updateBars();
    });
  });
}

document.getElementById('resetBtn').onclick = () => { inputs=[]; renderMetrics(); updateBars(); };

// init
renderPrior();
renderMetrics();
updateBars();
</script>
</body>
</html>
