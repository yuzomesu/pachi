// ── Bayesian inference ────────────────────────────
function infer(machine, obsArr) {
  const eps = 1e-12;
  const logP = Array(6).fill(Math.log(1/6));
  for (let mi = 0; mi < machine.metrics.length; mi++) {
    const m = machine.metrics[mi];
    const obs = obsArr[mi] || [];
    if (obs.reduce((a,b)=>a+b,0) === 0) continue;
    for (let s = 0; s < 6; s++) {
      const raw = m.type==='binomial' ? [m.probs[s], 1-m.probs[s]] : m.probs[s];
      const sumR = raw.reduce((a,b)=>a+b,0) || 1;
      const p = raw.map(x => Math.min(1-eps, Math.max(eps, x/sumR)));
      const k = Math.min(obs.length, p.length);
      for (let i=0; i<k; i++) logP[s] += obs[i] * Math.log(p[i]);
    }
  }
  const mx = Math.max(...logP);
  const w = logP.map(v => Math.exp(v-mx));
  const z = w.reduce((a,b)=>a+b,0) || 1;
  return w.map(x => x/z*100);
}

// ── State ─────────────────────────────────────────
let machIdx = 0;
let inputs = [];

function getObs(machine) {
  return machine.metrics.map((m, mi) => {
    const r = inputs[mi] || [];
    if (m.type === 'binomial') {
      const suc = r[0]||0, tot = r[1]||0;
      return [suc, Math.max(0, tot-suc)];
    }
    return r.map(v => v||0);
  });
}

// ── Render ────────────────────────────────────────
function renderTabs() {
  const el = document.getElementById('machineTabs');
  el.innerHTML = MACHINES.map((m, i) => `
    <button data-i="${i}" class="machine-tab px-5 py-2 rounded-full text-sm font-semibold border transition-all
      ${i===machIdx
        ? 'bg-violet-500 border-violet-400 text-white shadow-lg shadow-violet-500/30'
        : 'bg-white/5 border-white/10 text-slate-400 hover:bg-white/10 hover:text-white'
      }">${m.name}</button>
  `).join('');
  el.querySelectorAll('button').forEach(b => {
    b.onclick = () => { machIdx=+b.dataset.i; inputs=[]; renderTabs(); renderMetrics(); updateResults(); };
  });
}

function updateResults() {
  const probs = infer(MACHINES[machIdx], getObs(MACHINES[machIdx]));
  const top = probs.indexOf(Math.max(...probs));
  const badge = document.getElementById('topBadge');
  badge.textContent = S_META[top].label;
  badge.style.color = S_META[top].color;
  document.getElementById('bars').innerHTML = probs.map((p, i) => `
    <div class="flex items-center gap-3">
      <span class="w-10 text-right text-xs font-semibold shrink-0" style="color:${S_META[i].color}">${S_META[i].label.replace('設定','S')}</span>
      <div class="flex-1 h-3 bg-white/5 rounded-full overflow-hidden">
        <div class="bar-fill h-full rounded-full" style="width:${p.toFixed(2)}%;background:${S_META[i].color}"></div>
      </div>
      <span class="w-12 text-right text-xs font-mono shrink-0 ${i===top?'font-bold':'text-slate-400'}"
        style="${i===top?'color:'+S_META[i].color:''}">${p.toFixed(1)}%</span>
    </div>
  `).join('');
}

function refTable(m) {
  if (m.type === 'binomial') {
    const rows = S_META.map((sm, i) => {
      const q = m.probs[i];
      return `<tr><td class="py-0.5 pr-3 text-slate-400">${sm.label}</td><td class="py-0.5 pr-3 tabular-nums">${(q*100).toFixed(3)}%</td><td class="py-0.5 tabular-nums text-slate-400">1/${(1/q).toFixed(1)}</td></tr>`;
    }).join('');
    return `<details class="mt-3"><summary class="text-xs text-slate-600 hover:text-slate-400 cursor-pointer select-none">参考確率 ▾</summary>
      <table class="mt-2 text-xs w-full"><thead><tr class="text-slate-500"><th class="text-left pb-1">設定</th><th class="text-left pb-1">確率</th><th class="text-left pb-1">分母</th></tr></thead><tbody>${rows}</tbody></table>
    </details>`;
  }
  const hdr = m.categoryLabels.map(c=>`<th class="pb-1 pr-2">${c}</th>`).join('');
  const rows = S_META.map((sm, i) => {
    const ps=m.probs[i], s=ps.reduce((a,b)=>a+b,0)||1;
    return `<tr><td class="pr-2 py-0.5 text-slate-400">${sm.label}</td>${ps.map(p=>`<td class="pr-2 py-0.5 tabular-nums">${(p/s*100).toFixed(1)}%</td>`).join('')}</tr>`;
  }).join('');
  return `<details class="mt-3"><summary class="text-xs text-slate-600 hover:text-slate-400 cursor-pointer select-none">参考確率 ▾</summary>
    <div class="overflow-x-auto mt-2"><table class="text-xs whitespace-nowrap"><thead><tr class="text-slate-500"><th class="pr-2 pb-1 text-left">設定</th>${hdr}</tr></thead><tbody>${rows}</tbody></table></div>
  </details>`;
}

      const cats = m.categoryLabels.map((c,ci)=>`
        <label class="block"><span class="block text-xs text-slate-500 mb-1">${c}</span>
          <input type="number" inputmode="numeric" min="0" value="${inputs[mi]?.[ci]??''}" placeholder="0" data-mi="${mi}" data-ci="${ci}"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm font-mono focus:outline-none focus:border-violet-500 focus:bg-white/10 transition"></label>`).join('');
      inp = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3">${cats}</div>`;
    }
    card.innerHTML = `<p class="text-sm font-semibold text-slate-200">${m.name}</p>${inp}${refTable(m)}`;
    el.appendChild(card);
  });
  el.querySelectorAll('input[data-mi]').forEach(inp => {
    inp.addEventListener('input', () => {
      const mi=+inp.dataset.mi, ci=+inp.dataset.ci;
      if (!inputs[mi]) inputs[mi]=[];
      inputs[mi][ci]=Math.max(0,parseInt(inp.value)||0);
      updateResults();
    });
  });
}

document.getElementById('resetBtn').onclick = () => { inputs=[]; renderMetrics(); updateResults(); };

renderTabs();
renderMetrics();
updateResults();
</script>
</body>
</html>
