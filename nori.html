<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ノリ打ち計算ツール（2～3人用）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#111;

      margin:0.4em 0;

      width:100%;
      padding:10px;
      border-radius:6px;

  <!DOCTYPE html>
  <html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>ノリ打ち計算ツール（人数自由）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:#111;
        color:#f5f5f5;
        padding:16px;
        line-height:1.6;
      }
      h1, h2, h3 {
        margin:0.4em 0;
      }
      .card {
        background:#1e1e1e;
        border-radius:8px;
        padding:12px;
        margin-bottom:12px;
        border:1px solid #333;
      }
      label {
        display:block;
        font-size:0.9rem;
        margin-top:4px;
      }
      input[type="number"], select {
        width:100%;
        padding:4px 6px;
        margin-top:2px;
        box-sizing:border-box;
        border-radius:4px;
        border:1px solid #444;
        background:#111;
        color:#f5f5f5;
      }
      .row {
        display:flex;
        gap:8px;
        flex-wrap:wrap;
      }
      .col {
        flex:1 1 140px;
        min-width:0;
      }
      button {
        width:100%;
        padding:10px;
        border-radius:6px;
        border:none;
        font-size:1rem;
        cursor:pointer;
        background:#0d9488;
        color:#fff;
        font-weight:bold;
        margin:8px 0 12px;
      }
      button:hover {
        background:#0f766e;
      }
      .result-box {
        background:#020617;
        border-radius:8px;
        padding:10px;
        border:1px solid #1f2937;
        font-size:0.9rem;
      }
      .result-box p {
        margin:2px 0;
      }
      .small {
        font-size:0.8rem;
        color:#9ca3af;
      }
    </style>
  </head>
  <body>

  <h1>ノリ打ち計算ツール</h1>

  <!-- 0. 種別選択 -->
  <div class="card">
    <h2>① 種別を選択</h2>
    <div class="row">
      <div class="col">
        <label for="gameType">種別</label>
        <select id="gameType">
          <option value="pachi">パチンコ</option>
          <option value="slot">スロット</option>
        </select>
      </div>
    </div>
    <p class="small">※選んだ種別に応じて、以降の入力項目が切り替わります。</p>
  </div>

  <!-- ① 交換率入力 -->
  <div class="card">
    <h2>② 交換率</h2>
    <div class="row">
      <!-- スロット用 -->
      <div class="col slot-only">
        <label>1000円交換に必要な枚数（スロット）</label>
        <!-- 例: 等価20円スロ → 50、5.6枚 → 56 など -->
        <input id="slotRate" type="number" step="1" value="53">
      </div>

      <!-- パチンコ用 -->
      <div class="col pachi-only">
        <label>1000円交換に必要な玉数（パチンコ）</label>
        <!-- 例: 等価 → 250、28玉交換 → 280 など -->
        <input id="pachiRate" type="number" step="1" value="280">
      </div>
    </div>
  </div>

  <!-- ② 人数入力 -->
  <div class="card">
    <h2>③ 人数入力</h2>
    <div class="row">
      <div class="col">
        <label>人数</label>
        <input id="numPeople" type="number" step="1" min="1" value="2"inputmode="numeric">
      </div>
    </div>
    <p class="small">人数を変えると、下の入力欄が自動で増減します。</p>
  </div>

  <!-- ③ 各人の結果入力エリア（JSで動的生成） -->
  <div class="card">
    <h2>④ 各人の結果入力</h2>
    <div id="peopleContainer"></div>
  </div>

  <button type="button" onclick="calc()">計算する</button>

  <!-- ④ 結果表示 -->
  <div class="card">
    <h2>⑤ 結果</h2>

    <h3>各人の収支（円換算）</h3>
    <div class="result-box" id="eachResult">
      <p>人数と結果を入力して「計算する」を押してください。</p>
    </div>

    <h3 style="margin-top:10px;">ノリ打ち後の均等分配</h3>
    <div class="result-box" id="splitResult">
      <p>合計収支：- 円</p>
      <p>1人あたり：- 円</p>
      <p>各人の調整額：</p>
      <p class="small">
        調整額がプラス＝その人が他の人に渡す金額 / マイナス＝受け取る金額<br>
        （誰から誰に渡すかは、この調整額を見ながら決めてください）
      </p>
    </div>
  </div>

  <script>
    // 数値取得（空欄は0扱い）
    function num(id) {
      const el = document.getElementById(id);
      if (!el) return 0;

      // 入力があれば、それを優先
      if (el.value !== "") return Number(el.value);

      // ここから追加：placeholder を既定値として使う（完全に数字だけのとき）
      const ph = el.getAttribute("placeholder");
      if (ph && /^\d+(\.\d+)?$/.test(ph.trim())) {
        return Number(ph.trim());
      }

      // それ以外は 0
      return 0;
    }


    // 四捨五入
    function prec(v, digits = 0) {
      const p = Math.pow(10, digits);
      return Math.round(v * p) / p;
    }

    function getGameType() {
      return document.getElementById("gameType").value; // "slot" or "pachi"
    }

    // 種別に応じて表示/非表示切り替え
    function updateGameTypeVisibility() {
      const type = getGameType();
      document.querySelectorAll(".slot-only").forEach(el => {
        el.style.display = (type === "slot") ? "" : "none";
      });
      document.querySelectorAll(".pachi-only").forEach(el => {
        el.style.display = (type === "pachi") ? "" : "none";
      });
    }

    // 人数に応じて入力欄を作る
    function buildPeopleInputs() {
      const container = document.getElementById("peopleContainer");
      const n = Math.max(1, num("numPeople"));
      const type = getGameType();

      container.innerHTML = "";

      for (let i = 1; i <= n; i++) {
        const wrapper = document.createElement("div");
        wrapper.className = "card";

        // 共通部分＋種別ごとの入力欄をまとめて書く
        wrapper.innerHTML = `
          <h3>人${i}</h3>
          <div class="row">
            <div class="col">
              <label>現金投資（円）</label>
              <input id="p${i}_cashInvest" type="number"inputmode="decimal" placeholder="0">
            </div>
            <div class="col">
              <label>回収金額（円）</label>
              <input id="p${i}_cashPayout" type="number"inputmode="decimal" placeholder="0">
              
            </div>
          </div>

          <!-- スロット用：メダル -->
          <div class="row slot-only">
            <div class="col">
              <label>再プレイで使ったメダル（枚）</label>
              <input id="p${i}_replayMedals" type="number"inputmode="decimal" placeholder="0">
            </div>
            <div class="col">
              <label>貯メダルした枚数（枚）</label>
              <input id="p${i}_savedMedals" type="number"inputmode="decimal" placeholder="0">
            </div>
          </div>

          <!-- パチンコ用：玉 -->
          <div class="row pachi-only">
            <div class="col">
              <label>再プレイで使った玉数（玉）</label>
              <input id="p${i}_replayBalls" type="number"inputmode="decimal" placeholder="0">
            </div>
            <div class="col">
              <label>貯玉した玉数（玉）</label>
              <input id="p${i}_savedBalls" type="number"inputmode="decimal" placeholder="0">
            </div>
          </div>
        `;

        container.appendChild(wrapper);
      }

      // 新しく作った要素にも効かせるため、ここでも表示切り替え
      updateGameTypeVisibility();
    }

    // 1人分の収支計算（円）
    function calcPerson(i, gameType, slotYenPerUnit, pachiYenPerUnit) {
      const cashInvest   = num(`p${i}_cashInvest`);
      const cashPayout   = num(`p${i}_cashPayout`);
      const replayMedals = num(`p${i}_replayMedals`);
      const savedMedals  = num(`p${i}_savedMedals`);
      const replayBalls  = num(`p${i}_replayBalls`);
      const savedBalls   = num(`p${i}_savedBalls`);

      let result = cashPayout - cashInvest;

      if (gameType === "slot") {
        // スロット：メダルのみ使用
        result += savedMedals * slotYenPerUnit;
        result -= replayMedals * slotYenPerUnit;
      } else {
        // パチンコ：玉のみ使用
        result += savedBalls * pachiYenPerUnit;
        result -= replayBalls * pachiYenPerUnit;
      }

      return prec(result, 0);
    }

    function calc() {
      const n = Math.max(1, num("numPeople"));
      const gameType = getGameType();

      // 1000円あたり枚数/玉数 → 1枚(玉)あたりの円へ変換
      const slotPer1000  = num("slotRate");   // 例: 53枚
      const pachiPer1000 = num("pachiRate");  // 例: 280玉

      const slotYenPerUnit  = slotPer1000  > 0 ? (1000 / slotPer1000)  : 0;
      const pachiYenPerUnit = pachiPer1000 > 0 ? (1000 / pachiPer1000) : 0;

      const nets = [];
      let total = 0;

      for (let i = 1; i <= n; i++) {
        const net = calcPerson(i, gameType, slotYenPerUnit, pachiYenPerUnit);
        nets.push(net);
        total += net;
      }

      // 各人の収支表示
      const eachBox = document.getElementById("eachResult");
      let html = "";
      for (let i = 0; i < n; i++) {
        html += `<p>人${i + 1}：${nets[i].toLocaleString()} 円</p>`;
      }
      html += `<p class="small">※貯メダル / 貯玉 / 再プレイも円換算した収支です（${gameType === "slot" ? "スロット" : "パチンコ"}）。</p>`;
      eachBox.innerHTML = html;

      // 均等割り
      const splitBox = document.getElementById("splitResult");
      const perPerson = prec(total / n, 0);

      let adjHtml = "";
      for (let i = 0; i < n; i++) {
        const adjust = prec(nets[i] - perPerson, 0);
        adjHtml += `<p>人${i + 1} の調整額：${adjust.toLocaleString()} 円</p>`;
      }

      splitBox.innerHTML =
        `<p>合計収支：${total.toLocaleString()} 円</p>` +
        `<p>1人あたり：${perPerson.toLocaleString()} 円</p>` +
        adjHtml +
        `<p class="small">
          調整額がプラス＝その人が他の人に渡す金額 / マイナス＝受け取る金額<br>
        </p>`;
    }

    // 初期表示＋イベント設定
    document.addEventListener("DOMContentLoaded", () => {
      // 初期の入力欄生成
      buildPeopleInputs();

      // 人数変更で入力欄を再生成
      document.getElementById("numPeople").addEventListener("input", buildPeopleInputs);

      // 種別変更で表示切り替え＆入力欄再生成
      document.getElementById("gameType").addEventListener("change", () => {
        updateGameTypeVisibility();
        buildPeopleInputs();
      });

      // 初回の表示切り替え
      updateGameTypeVisibility();
    });
  </script>

  </body>
  </html>
